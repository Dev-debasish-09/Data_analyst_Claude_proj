name: CI

# Lint and test on every push and pull request. The git root is the parent of `retail-pulse/`,
# so workflows live here and every job runs inside the project folder.
on:
  push:
    branches: [main, master, developer]
  pull_request:
    branches: [main, master]

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: retail-pulse

env:
  RETAIL_PULSE_ENV: dev  # tests build their own synthetic database; no secrets are used or needed

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: retail-pulse/pyproject.toml
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]  # the minimum supported version and the latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: retail-pulse/pyproject.toml
      - name: Install the project and dev tools
        run: pip install -e ".[dev]"
      - name: Test
        # The live-API test skips itself because no ANTHROPIC_API_KEY is set here.
        run: pytest
