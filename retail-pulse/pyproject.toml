[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-pulse"
version = "0.1.0"
description = "Turns weekly retail transaction data into an automated, plain-English analyst report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "anthropic>=0.40",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Free local report engine (Hugging Face). Heavy (PyTorch), so it is opt-in: pip install -e ".[hf]"
hf = [
    "transformers>=4.40",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live: calls the real Claude API; runs only when ANTHROPIC_API_KEY is set (costs money)",
    "local_model: downloads and runs a real Hugging Face model (GBs, slow); opt-in only",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
